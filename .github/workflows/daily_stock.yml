name: GETSTOCK Daily AI Stock Picker

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 16:40 (三大法人初版) 與 22:10 (融資融券與大戶定稿)
    - cron: '40 8 * * 1-5'
    - cron: '10 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '指定交易日 YYYYMMDD (留空則自動抓最近一個交易日)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run GETSTOCK Full-Auto AI Pipeline
        env:
          TZ: Asia/Taipei
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python auto_pick.py "${{ github.event.inputs.date }}" --force
          else
            python auto_pick.py --force
          fi

      - name: Commit and Push updated picks & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/ twse_*/ index.html chips_radar.html site_publish.html
          git diff --staged --quiet || git commit -m "chore: auto update AI stock picks $(date +'%Y-%m-%d %H:%M')"
          git push
